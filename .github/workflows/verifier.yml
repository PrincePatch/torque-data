name: Vérifier les données

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verifier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Structure, identifiants, références, règles
        run: python outils/verifier.py
      - name: index.json à jour
        run: |
          python outils/generer_index.py
          git diff --exit-code -- index.json || (echo "::error::index.json n'est pas à jour : lancer python outils/generer_index.py" && exit 1)
